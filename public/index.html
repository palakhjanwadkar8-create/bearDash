<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bear Dash: Pixel Adventure — Cute Multiplayer Survival Racing</title>
  <meta name="description" content="A cheerful multiplayer pixel adventure racing game where adorable baby bears compete to survive obstacles, collect gems, and dash to the finish line!" />
  <meta name="theme-color" content="#FF7B54" />
  
  <!-- Favicon: Cute Pixel Baby Bear with Crown -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FFB085'/><circle cx='9' cy='9' r='4' fill='%23B86227'/><circle cx='23' cy='9' r='4' fill='%23B86227'/><circle cx='9' cy='9' r='2' fill='%23FFD8B0'/><circle cx='23' cy='9' r='2' fill='%23FFD8B0'/><rect x='6' y='10' width='20' height='16' rx='8' fill='%23D97736'/><ellipse cx='16' cy='19' rx='5' ry='4' fill='%23FFE3C4'/><ellipse cx='16' cy='18' rx='2.5' ry='1.5' fill='%233D2213'/><circle cx='12' cy='16' r='2' fill='%2322150C'/><circle cx='20' cy='16' r='2' fill='%2322150C'/><circle cx='12.5' cy='15.5' r='0.7' fill='%23FFFFFF'/><circle cx='20.5' cy='15.5' r='0.7' fill='%23FFFFFF'/><polygon points='12,7 14,4 16,6 18,4 20,7' fill='%23FFD166' stroke='%23C99700' stroke-width='0.5'/></svg>" />

  <!-- Pixel & Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CDN & Custom CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            silkscreen: ['"Silkscreen"', 'cursive', 'sans-serif'],
            fun: ['"Fredoka"', 'cursive', 'sans-serif'],
          },
          colors: {
            bear: {
              peach: '#FFB085',
              orange: '#FF7B54',
              pink: '#FF758F',
              purple: '#9D4EDD',
              blue: '#4CC9F0',
              green: '#70E000',
              yellow: '#FFD166',
              honey: '#E76F51',
              dark: '#2B2D42',
              cream: '#FFF7ED',
            }
          },
          animation: {
            'bounce-slow': 'bounce 2.5s infinite',
            'float': 'float 3s ease-in-out infinite',
            'pulse-fast': 'pulse 0.8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'wiggle': 'wiggle 0.5s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            },
            wiggle: {
              '0%, 100%': { transform: 'rotate(-3deg)' },
              '50%': { transform: 'rotate(3deg)' },
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-[#1E1428] text-white font-fun selection:bg-[#FF758F] selection:text-white overflow-x-hidden antialiased">
  <div id="root"></div>
  <script type="module" src="/bundle.js"></script>
</body>
</html>
